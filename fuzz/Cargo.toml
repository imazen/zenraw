[package]
name = "zenraw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
enough = "0.4.5"

[dependencies.zenraw]
path = ".."
default-features = false
features = ["std", "rawloader"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_classify"
path = "fuzz_targets/fuzz_classify.rs"
doc = false

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
doc = false

[features]
inventory = ["zenraw/inventory", "dep:zencodec"]

[dependencies.zencodec]
git = "https://github.com/imazen/zencodec"
rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce"
optional = true

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
doc = false
required-features = ["inventory"]

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce" }
