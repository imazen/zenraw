[package]
name = "zenraw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
enough = "0.4.3"

[dependencies.zenraw]
path = ".."
default-features = false
features = ["std", "rawloader"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_classify"
path = "fuzz_targets/fuzz_classify.rs"
doc = false

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
doc = false

[features]
inventory = ["zenraw/inventory", "dep:zencodec"]

[dependencies.zencodec]
git = "https://github.com/imazen/zencodec"
rev = "feb09f9fd25e90e49a30d7161db8f3b558dfb2a6"
optional = true

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
doc = false
required-features = ["inventory"]

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "feb09f9fd25e90e49a30d7161db8f3b558dfb2a6" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "feb09f9fd25e90e49a30d7161db8f3b558dfb2a6" }
