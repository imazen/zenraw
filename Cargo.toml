[package]
name = "zenraw"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Camera RAW and DNG decoder with zenpixels integration"
categories = ["multimedia::images"]
keywords = ["raw", "dng", "image", "decoder", "camera"]
repository = "https://github.com/imazen/zenraw"
readme = "README.crates.md"
include = [
    "/src/**",
    "/tests/support/inventory_fixtures.rs",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
rawloader = { version = "0.37.1", optional = true }
rawler = { version = "0.7.2", optional = true }
thiserror = { version = "2.0.21", default-features = false }
whereat = { version = "0.1.5", default-features = false }
enough = { version = "0.4.5", default-features = false }
how-far = { version = "0.1.0", default-features = false }
zenpixels = { version = "0.5", default-features = false }
zencodec = { version = "0.3", optional = true }
zenmeta = { version = "0.2", default-features = false, features = ["inventory"], optional = true }
archmage = { version = "0.9.33", default-features = false }
magetypes = { version = "0.9.33", default-features = false }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
memchr = { version = "2.8.0", default-features = false }

# Metadata crates
kamadak-exif = { version = "0.6.1", optional = true }

[dev-dependencies]
how-far-along = "0.1.0"
zenutils-fuzz = "0.1.0"
zensim = { version = "0.2.4"}
bytemuck = "1.25.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
zenbench = { version = "0.1.11", features = ["criterion-compat"] }
# Decoder-only inventory conformance checks preserve the native error type.
zencodec-testkit = "0.3"
zenpixels-convert = { version = "0.5", default-features = false }

[[bench]]
name = "decode_bench"
harness = false

# Heaptrack allocation-profiling harness for the decode-from-bytes path.
# Decode works with default features (rawloader backend); no extra features.
[[example]]
name = "heaptrack_decode"

[features]
default = ["std", "rawloader", "ultrahdr"]
std = ["enough/std", "whereat/std"]
rawloader = ["dep:rawloader"]
rawler = ["dep:rawler", "std"]
zencodec = ["dep:zencodec"]
inventory = ["zencodec", "dep:zenmeta"]
darktable = ["std"]
# Compatibility feature. RAW decode and Apple metadata parsing need no Ultra HDR math.
ultrahdr = []
exif = ["dep:kamadak-exif"]
# Dev-only: exposes internal SIMD kernels for per-tier benchmarking. Not API.
_dev = ["archmage/testable_dispatch"]
xmp = ["std"]
apple = ["exif", "xmp"]

[profile.test]
opt-level = 2

[[bench]]
name = "kernel_tiers"
harness = false
required-features = ["_dev"]

[patch.crates-io]
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }

[[test]]
name = "inventory"
required-features = ["inventory"]

[[example]]
name = "inventory_dump"
required-features = ["inventory"]

[[example]]
name = "inventory_stress"
required-features = ["inventory"]
