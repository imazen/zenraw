[package]
name = "zenraw"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Camera RAW and DNG decoder with zenpixels integration"
categories = ["multimedia::images"]
keywords = ["raw", "dng", "image", "decoder", "camera"]
repository = "https://github.com/imazen/zenraw"
readme = "README.crates.md"
include = [
    "/src/**",
    "/tests/support/inventory_fixtures.rs",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
rawloader = { version = "0.37.1", optional = true }
rawler = { version = "0.7.2", optional = true }
thiserror = { version = "2.0.18", default-features = false }
whereat = { version = "0.1.5", default-features = false }
enough = { version = "0.4.3", default-features = false }
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "4fda439133d465246174b55f62426dc54ef204dd", version = ">=0.1.26, <0.3.0", optional = true }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "4fda439133d465246174b55f62426dc54ef204dd", version = "0.1.0", default-features = false, features = ["inventory"], optional = true }
archmage = { version = "0.9.30", default-features = false }
magetypes = { version = "0.9.30", default-features = false }
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc"] }
memchr = { version = "2.8.0", default-features = false }
ultrahdr-core = { version = "0.3.0", default-features = false, features = ["transfer"], optional = true }

# Metadata crates
kamadak-exif = { version = "0.6.1", optional = true }

[dev-dependencies]
zenutils-fuzz = "0.1.0"
zensim = { version = "0.2.4"}
bytemuck = "1.25.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
# Decoder-only inventory conformance checks preserve the native error type.
zencodec-testkit = ">=0.1.0, <0.3.0"

[[bench]]
name = "decode_bench"
harness = false

# Heaptrack allocation-profiling harness for the decode-from-bytes path.
# Decode works with default features (rawloader backend); no extra features.
[[example]]
name = "heaptrack_decode"

[features]
default = ["std", "rawloader", "ultrahdr"]
std = ["enough/std", "whereat/std"]
rawloader = ["dep:rawloader"]
rawler = ["dep:rawler", "std"]
zencodec = ["dep:zencodec"]
inventory = ["zencodec", "dep:zenmeta"]
darktable = ["std"]
ultrahdr = ["dep:ultrahdr-core"]
exif = ["dep:kamadak-exif"]
# Dev-only: exposes internal SIMD kernels for per-tier benchmarking. Not API.
_dev = ["archmage/testable_dispatch"]
xmp = ["std"]
apple = ["exif", "xmp"]

[profile.test]
opt-level = 2

[[bench]]
name = "kernel_tiers"
harness = false
required-features = ["_dev"]

[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "4fda439133d465246174b55f62426dc54ef204dd" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "4fda439133d465246174b55f62426dc54ef204dd" }

[[test]]
name = "inventory"
required-features = ["inventory"]

[[example]]
name = "inventory_dump"
required-features = ["inventory"]

[[example]]
name = "inventory_stress"
required-features = ["inventory"]
