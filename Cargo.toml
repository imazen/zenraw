[package]
name = "zenraw"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Camera RAW and DNG decoder with zenpixels integration"
categories = ["multimedia::images"]
keywords = ["raw", "dng", "image", "decoder", "camera"]
repository = "https://github.com/imazen/zenraw"

[dependencies]
rawloader = "0.37"
thiserror = { version = "2.0", default-features = false }
whereat = { version = "0.1.3", default-features = false }
enough = { version = "0.4", default-features = false }
zenpixels = { version = "0.1", path = "../zenpixels/zenpixels", default-features = false }
zencodec = { version = "0.1", path = "../zencodec", optional = true }

[dev-dependencies]

[features]
default = ["std"]
std = ["enough/std", "whereat/std"]
zencodec = ["dep:zencodec"]
darktable = ["std"]

[profile.test]
opt-level = 2

[patch.crates-io]
zenpixels = { path = "../zenpixels/zenpixels" }
