[package]
name = "zenraw"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Camera RAW and DNG decoder with zenpixels integration"
categories = ["multimedia::images"]
keywords = ["raw", "dng", "image", "decoder", "camera"]
repository = "https://github.com/imazen/zenraw"

[dependencies]
rawloader = { version = "0.37", optional = true }
rawler = { version = "0.7.2", optional = true }
thiserror = { version = "2.0", default-features = false }
whereat = { version = "0.1.3", default-features = false }
enough = { version = "0.4", default-features = false }
zenpixels = { version = "0.1", path = "../zenpixels/zenpixels", default-features = false }
zencodec = { version = "0.1", path = "../zencodec", optional = true }

# Metadata crates
kamadak-exif = { version = "0.6", optional = true }

[dev-dependencies]
zensim = { version = "0.2", path = "../zensim/zensim" }
bytemuck = "1.25"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["std", "rawloader"]
std = ["enough/std", "whereat/std"]
rawloader = ["dep:rawloader"]
rawler = ["dep:rawler", "std"]
zencodec = ["dep:zencodec"]
darktable = ["std"]
exif = ["dep:kamadak-exif"]
xmp = ["std"]

[profile.test]
opt-level = 2

[patch.crates-io]
zenpixels = { path = "../zenpixels/zenpixels" }
zensim = { path = "../zensim/zensim" }
