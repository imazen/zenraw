name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true
  # Public-API snapshot regen (tests/public_api_doc.rs) needs nightly rustdoc
  # + cargo-public-api; only the clippy job carries them and runs the check.
  ZEN_API_DOC: off

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --features "rawler,darktable,exif,xmp,apple,zencodec,ultrahdr"

      - name: Check (no-default-features, std only)
        run: cargo check --no-default-features --features std

  rawloader-only:
    name: Test rawloader backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (rawloader without rawler)
        run: cargo test --no-default-features --features "std,rawloader"

  feature-perms:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check (no-default-features, std only)
        run: cargo check --no-default-features --features std

      - name: Check (rawler,std)
        run: cargo check --features "rawler,std"

      - name: Check (zencodec)
        run: cargo check --features zencodec

      - name: Check (exif,xmp,apple)
        run: cargo check --features "exif,xmp,apple"

      - name: Check (zencodec,ultrahdr,exif)
        run: cargo check --features "zencodec,ultrahdr,exif"

      - name: Check (--all-features)
        run: cargo check --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy --all-targets --features "rawler,darktable,exif,xmp,apple,zencodec,ultrahdr" -- -D warnings

      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for cargo-public-api
      - uses: dtolnay/rust-toolchain@stable # restore stable as default
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Public-API snapshot is current
        run: cargo test --test public_api_doc
        env:
          ZEN_API_DOC: check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --rust-version
