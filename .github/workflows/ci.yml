name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          # Use crates.io for published deps, remove unpublished ones
          sed \
            -e 's|, path = "\.\./zenpixels/zenpixels"||g' \
            -e 's|, path = "\.\./zensim/zensim"||g' \
            -e '/zencodec/d' \
            -e '/ultrahdr-core/d' \
            -e 's|"std", "rawloader", "ultrahdr"|"std", "rawloader"|' \
            -e '/\[patch.crates-io\]/,$d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          rm -f Cargo.lock

      - name: Test (default features)
        run: cargo test

      - name: Test (rawler + darktable + exif + xmp + apple)
        run: cargo test --features "rawler,darktable,exif,xmp,apple"

      - name: Check (no-default-features, std only)
        run: cargo check --no-default-features --features std

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|, path = "\.\./zenpixels/zenpixels"||g' \
            -e 's|, path = "\.\./zensim/zensim"||g' \
            -e '/zencodec/d' \
            -e '/ultrahdr-core/d' \
            -e 's|"std", "rawloader", "ultrahdr"|"std", "rawloader"|' \
            -e '/\[patch.crates-io\]/,$d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          rm -f Cargo.lock

      - name: Clippy (all testable features)
        run: cargo clippy --all-targets --features "rawler,darktable,exif,xmp,apple" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|, path = "\.\./zenpixels/zenpixels"||g' \
            -e 's|, path = "\.\./zensim/zensim"||g' \
            -e '/zencodec/d' \
            -e '/ultrahdr-core/d' \
            -e 's|"std", "rawloader", "ultrahdr"|"std", "rawloader"|' \
            -e '/\[patch.crates-io\]/,$d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          rm -f Cargo.lock

      - name: Check MSRV
        run: cargo hack check --rust-version
