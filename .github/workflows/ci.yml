name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # `github.head_ref` is set ONLY on pull_request events. On a push it is
  # empty, so the group fell through to `github.run_id` — unique per run,
  # so pushes never collided and nothing was ever cancelled. `github.ref`
  # is set on both event types (`refs/heads/main` on push,
  # `refs/pull/N/merge` on a PR), so PR behaviour is unchanged while
  # consecutive pushes to a branch now supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test

      - name: Exact normalization across runtime SIMD tiers
        run: cargo test --features _dev --lib normalization_matches_scalar_bits_for_special_values -- --nocapture

      - name: Test (all features)
        run: cargo test --features "rawler,darktable,exif,xmp,apple,zencodec,ultrahdr"

      - name: Check (no-default-features, std only)
        run: cargo check --no-default-features --features std

  rawloader-only:
    name: Test rawloader backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (rawloader without rawler)
        run: cargo test --no-default-features --features "std,rawloader"

  rawler-only:
    name: Test rawler backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Regression gate for imazen/zenraw#10: the rawler backend must build
      # and test WITHOUT the rawloader crate in the graph.
      - name: Test (rawler without rawloader)
        run: cargo test --no-default-features --features "std,rawler"

  feature-perms:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check (no-default-features, std only)
        run: cargo check --no-default-features --features std

      - name: Check (rawler,std)
        run: cargo check --features "rawler,std"

      # `--features rawler` above still pulls in default `rawloader`; these
      # two are the combos from imazen/zenraw#10 that used to fail to compile.
      - name: Check (no-default-features, std,rawler)
        run: cargo check --no-default-features --features "std,rawler"

      - name: Check (no-default-features, std,rawler,ultrahdr)
        run: cargo check --no-default-features --features "std,rawler,ultrahdr"

      - name: Check (zencodec)
        run: cargo check --features zencodec

      - name: Check (exif,xmp,apple)
        run: cargo check --features "exif,xmp,apple"

      - name: Check (zencodec,ultrahdr,exif)
        run: cargo check --features "zencodec,ultrahdr,exif"

      - name: Check (--all-features)
        run: cargo check --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy --all-targets --features "rawler,darktable,exif,xmp,apple,zencodec,ultrahdr" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --rust-version
